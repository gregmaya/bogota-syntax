name: Task · Tarea
description: A piece of planned work. · Una tarea planeada.
title: "English title · Título en español"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English and Spanish, and spell out acronyms the first time in each language ([glossary](https://github.com/gregmaya/bogota-syntax/blob/main/docs/glossary.md)).
        Escribe en inglés y español, y escribe las siglas completas la primera vez en cada idioma ([glosario](https://github.com/gregmaya/bogota-syntax/blob/main/docs/glossary.md)).
  - type: textarea
    id: what
    attributes:
      label: What and why · Qué y por qué
      value: |
        **EN:**

        **ES:**
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps · Pasos
      description: One checklist line per step, in both languages. · Una línea por paso, en ambos idiomas.
      value: |
        - [ ] English · Español
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when · Listo cuando
      value: |
        **EN:**

        **ES:**
