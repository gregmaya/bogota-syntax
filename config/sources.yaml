# Every dataset the pipeline reads. A new source is added here first.
# Licences were checked through the CKAN API of datosabiertos.bogota.gov.co on 2026-11-21.
# Downloads are recorded in config/manifest.json (URL, query, date, feature count, SHA-256).

sources:
  renobo_proyectos:
    title: Proyecto de RenoBo
    publisher: Empresa de Renovación y Desarrollo Urbano de Bogotá (RENOBO)
    licence: CC-BY-4.0
    ckan_dataset: proyecto-de-renobo
    kind: file
    url: https://datosabiertos.bogota.gov.co/dataset/79a5cbd6-c2e9-4cff-8056-acf55158b8a3/resource/36337a19-f13a-4955-aefb-7f8e90c13861/download/proyecto_de_renobo.gpkg
    layer: temp_wfs_layer
    # Project IDs are not unique in this layer (several polygons share one); GmlID is.

  ideca_limite_bogota:
    title: Mapa de Referencia, Municipio (Bogotá D.C.)
    publisher: IDECA / UAECD
    licence: CC-BY-4.0
    ckan_dataset: mapa-de-referencia
    kind: arcgis_layer
    service: https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/Mapa_Referencia/MapServer
    layer_id: 47
    where: "MUNCODIGO = '11001'"
    expected_count: 1

  sdp_perimetro_urbano:
    title: Perímetro urbano, POT Bogotá D.C. (Decreto 555 de 2021)
    publisher: Secretaría Distrital de Planeación (SDP)
    licence: CC-BY-4.0
    ckan_dataset: perimetro-urbano-bogota-d-c
    kind: file
    url: https://datosabiertos.bogota.gov.co/dataset/12a704ee-e5bb-4c5d-bad6-a5069d12f90a/resource/bfc61e3c-fa58-4fe7-9581-7ead66c494cb/download/perimetrourbano.gpkg
    layer: PerimetroUrbano
    # Arrives in the local plane PCS_CarMAGBOG; reprojected to EPSG:9377 at ingest.
    # Used for the stitch extent (ADR-0007). SDP's clasificacion-del-suelo would also
    # give the urban area, but it is CC BY-NC 4.0, which ODbL outputs cannot use.

  ideca_malla_vial:
    title: Mapa de Referencia, Malla Vial (Malla Vial Integral)
    publisher: IDECA / UAECD
    licence: CC-BY-4.0
    ckan_dataset: mapa-de-referencia
    kind: arcgis_layer
    service: https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/Mapa_Referencia/MapServer
    layer_id: 13
    where: "1=1"
    # The whole layer is fetched (not clipped to the pilot): the pilot's network extent
    # already covers ~97% of it, and the full city will need all of it.
    # The REST service does not state which Mapa de Referencia version it serves; the
    # manifest records the CKAN dataset's metadata_modified date instead.

  sdp_eje_vial:
    title: Eje vial, POT Bogotá D.C. (Decreto 555 de 2021)
    publisher: Secretaría Distrital de Planeación (SDP)
    licence: CC-BY-4.0
    ckan_dataset: eje-vial-bogota-d-c
    kind: file
    url: https://datosabiertos.bogota.gov.co/dataset/95cf10a5-3205-42d3-83c5-8a48abe59a9e/resource/af2aab89-e0b7-44f8-a31f-9abe5aac1589/download/eje_vial.gpkg
    layer: Eje_vial
    # Arterial axes of the POT. Built arterials (chosen by distance to MVI, not by
    # ESTADO_VIA) replace the cleaned MVI arterials inside Bogotá (ADR-0008).

  sdp_red_infraestructura_vial:
    title: Red de infraestructura vial arterial, POT Bogotá D.C. (Decreto 555 de 2021)
    publisher: Secretaría Distrital de Planeación (SDP)
    licence: CC-BY-4.0
    ckan_dataset: red-infraestructura-vial-bogota-d-c
    kind: file
    url: https://datosabiertos.bogota.gov.co/dataset/0e2bdaed-eb3c-4b14-90b4-44454013bbef/resource/40ddde9c-3867-4c06-8c42-db9d9bb99c79/download/redinfraestructuravialarterial.gpkg
    layer: RedInfraestructuraVialArterial
    # Full width of each POT arterial, cut into stretches between avenues; interchanges
    # are their own polygons ("Enlace Vehicular ..."). Guides the foreground cleaning
    # (ADR-0012). Arrives in PCS_CarMAGBOG. Licence checked against ODbL: CC BY 4.0,
    # attribution only, as for sdp_eje_vial.

  osm_vias:
    title: OpenStreetMap streets
    publisher: OpenStreetMap contributors
    licence: ODbL-1.0
    kind: osm_overpass
    # Fetched over the OSM cleaning area only: the stitch extent outside Bogotá plus a
    # 500 m overlap inside it (ADR-0007). Always the latest data, no date filter; the
    # manifest records when the query ran and the OSM timestamp Overpass reported.
    extent: osm_clean_area
    # Vehicular streets, to match what MVI draws (ADR-0005). No footways, paths,
    # tracks or service roads.
    highway:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
      - tertiary
      - tertiary_link
      - unclassified
      - residential
      - living_street
