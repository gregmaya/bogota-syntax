# Analysis settings. No magic numbers in code: everything tunable lives here.
# See docs/decisions/0003-network-source.md and 0004-study-extent.md.

# Centrality distance thresholds, in metres (EPSG:9377).
distances: [400, 800, 1200, 1600, 2000, 5000]

pilot:
  # The pilot areas are drawn in the viewer as dotted outlines. They are not a
  # computation boundary.
  # Selected from source renobo_proyectos by GmlID (project IDs are not unique).
  # This is the selection Gregorio made in data/renobo_selection.gpkg on 2026-11-21.
  source: renobo_proyectos
  gml_ids:
    - Proyecto_de_RenoBo.76
    - Proyecto_de_RenoBo.81
    - Proyecto_de_RenoBo.82
    - Proyecto_de_RenoBo.83
    - Proyecto_de_RenoBo.84
    - Proyecto_de_RenoBo.86
    - Proyecto_de_RenoBo.87
    - Proyecto_de_RenoBo.91
    - Proyecto_de_RenoBo.94
    - Proyecto_de_RenoBo.97
    - Proyecto_de_RenoBo.99
    - Proyecto_de_RenoBo.102
    - Proyecto_de_RenoBo.103
    - Proyecto_de_RenoBo.104
    - Proyecto_de_RenoBo.105
    - Proyecto_de_RenoBo.108
    - Proyecto_de_RenoBo.109
    - Proyecto_de_RenoBo.110
    - Proyecto_de_RenoBo.111
    - Proyecto_de_RenoBo.112
    - Proyecto_de_RenoBo.113
    - Proyecto_de_RenoBo.114
    - Proyecto_de_RenoBo.118
    - Proyecto_de_RenoBo.119
    - Proyecto_de_RenoBo.120
    - Proyecto_de_RenoBo.121
    - Proyecto_de_RenoBo.122
    - Proyecto_de_RenoBo.126
    - Proyecto_de_RenoBo.127
    - Proyecto_de_RenoBo.128
    - Proyecto_de_RenoBo.129
    - Proyecto_de_RenoBo.130
    - Proyecto_de_RenoBo.135
    - Proyecto_de_RenoBo.136
    - Proyecto_de_RenoBo.147
    - Proyecto_de_RenoBo.150
  # Live area = pilot areas buffered by this margin. Results are reported here.
  live_margin_m: 5000

# Dead buffer around the live area, used for routing only.
# Effective width = max(buffer_min_m, max(distances)).
buffer_min_m: 5000

# One stitched network for the urban area plus a margin (ADR-0007). MVI inside the
# Bogotá boundary, OSM outside it. Each analysis clips its network extent from it.
stitch:
  boundary_source: ideca_limite_bogota
  urban_source: sdp_perimetro_urbano
  # Stitch extent = urban perimeter buffered by this, united with the network extent.
  # Must be at least the dead-buffer width, so the full city keeps its whole buffer.
  stitch_margin_m: 10000
  # Each side is cleaned this far past the boundary before the cut, so the seam is
  # not at the edge of what neatnet sees.
  clean_overlap_m: 500

# Cleaning each side with neatnet before the join (ADR-0005, ADR-0007).
clean:
  # Arguments passed to neatnet.neatify; empty means neatnet's defaults.
  neatify: {}
  # A raw line counts as kept if a cleaned line lies within match_m of it. neatnet
  # merges the two carriageways of a divided road into one line between them, so this
  # must cover half the widest median: at 25 m, 81.7 km of avenues (AC/AK) did not match;
  # at 50 m, 8.9 km (first run, 2026-11-22).
  match_m: 50
  # Spacing of the points sampled along each raw line for that test.
  sample_step_m: 10
  # The join stops if a piece at least min_piece_m long keeps less than min_kept_ratio
  # of its length. Shorter pieces that vanish are listed in the review layer only.
  min_piece_m: 100
  min_kept_ratio: 0.5

# SDP arterial axes replace cleaned MVI arterials inside Bogotá (ADR-0008).
# Values from the interchange test, scripts/adr0008_interchanges.py.
arterials:
  source: sdp_eje_vial
  # An axis line is used if min_axis_on_mvi of its length lies within axis_match_m of
  # raw MVI: built arterials, chosen by geometry rather than ESTADO_VIA.
  axis_match_m: 25
  min_axis_on_mvi: 0.9
  # Cleaned MVI lines of these types (or untyped) with half their length within
  # corridor_m of an axis are removed; so are leftover pieces wholly within ramp_zone_m
  # that only touched removed lines. Service roads go with the arterial (accepted
  # 2026-11-22).
  arterial_types: [AC, AK]
  corridor_m: 60
  ramp_zone_m: 150
  # SDP axes that should meet often stop short. An axis end that meets nothing is joined
  # to the nearest line within axis_snap_m (227 such ends; 170 within 5 m, 188 within
  # 10 m; 2026-11-22).
  axis_snap_m: 10
  # Last step on the MVI side: dead ends are extended straight ahead onto a line within
  # this distance (neatnet.extend_lines), closing small gaps in MVI. Most MVI islands
  # are already islands in raw MVI; at 10 m, 148 pieces became 102 in the test of
  # 2026-11-22 (5 m: 111, 20 m: 81 but ~1,200 dead ends closed).
  extend_lines_m: 10

# Joining OSM (outside Bogotá) to MVI (inside) at the boundary (ADR-0007).
join:
  # OSM loose ends on the boundary are joined to MVI by a connector up to snap_m long:
  # first to an MVI loose end on the boundary, else to the nearest MVI line.
  # Provisional, pending review: at 25 m, 87% of OSM ends have an MVI line in reach;
  # at 50 m, 91% (2026-11-22).
  snap_m: 25
  # Candidates up to this length are written for review, accepted or not.
  candidate_max_m: 100

# Finishing the stitched network into intersection-to-intersection segments (ADR-0009).
network:
  # mvi_only (v1, ADR-0010): cleaned MVI inside Bogotá, nothing else.
  # stitched (ADR-0007/0008, shelved): MVI + SDP axes + OSM from `bogota-syntax join`.
  mode: mvi_only
  # mvi_only: dead ends are extended straight ahead onto a line within this distance.
  extend_lines_m: 10
  # Lines neatnet drew (no source id) take the attributes of the raw line with the most
  # length within this distance.
  recover_m: 15
  # Lines shorter than this are collapsed into a point before merging (24 city-wide,
  # 2026-11-22); cityseer would drop them and break the one-to-one match (ADR-0009).
  min_segment_m: 0.5

# Simplest-path (angular) measures, passed to cityseer's centrality_simplest
# (ADR-0009, ADR-0011). Expressions use c, the angular cost (degrees of turning on the
# simplest route); they are cityseer 5.8's own defaults for these names.
centrality:
  closeness:
    density: "1"                    # segments reachable within the distance
    farness: "1 + c / 90"           # angular total depth
    harmonic: "1 / (1 + c / 90)"    # angular harmonic closeness
  betweenness:
    betweenness: "1"                # angular choice
  postprocess:
    hillier: "density**2 / farness" # Hillier's normalised integration

# No scenarios in v1 (ADR-0003): one network, MVI inside Bogotá + OSM outside.
