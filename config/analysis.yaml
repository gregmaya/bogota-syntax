# Analysis settings. No magic numbers in code: everything tunable lives here.
# See docs/decisions/0003-network-source.md and 0004-study-extent.md.

# Centrality distance thresholds, in metres (EPSG:9377).
distances: [400, 800, 1200, 1600, 2000, 5000]

pilot:
  # The pilot areas are drawn in the viewer as dotted outlines. They are not a
  # computation boundary.
  # Selected from source renobo_proyectos by GmlID (project IDs are not unique).
  # This is the selection Gregorio made in data/renobo_selection.gpkg on 2026-11-21.
  source: renobo_proyectos
  gml_ids:
    - Proyecto_de_RenoBo.76
    - Proyecto_de_RenoBo.81
    - Proyecto_de_RenoBo.82
    - Proyecto_de_RenoBo.83
    - Proyecto_de_RenoBo.84
    - Proyecto_de_RenoBo.86
    - Proyecto_de_RenoBo.87
    - Proyecto_de_RenoBo.91
    - Proyecto_de_RenoBo.94
    - Proyecto_de_RenoBo.97
    - Proyecto_de_RenoBo.99
    - Proyecto_de_RenoBo.102
    - Proyecto_de_RenoBo.103
    - Proyecto_de_RenoBo.104
    - Proyecto_de_RenoBo.105
    - Proyecto_de_RenoBo.108
    - Proyecto_de_RenoBo.109
    - Proyecto_de_RenoBo.110
    - Proyecto_de_RenoBo.111
    - Proyecto_de_RenoBo.112
    - Proyecto_de_RenoBo.113
    - Proyecto_de_RenoBo.114
    - Proyecto_de_RenoBo.118
    - Proyecto_de_RenoBo.119
    - Proyecto_de_RenoBo.120
    - Proyecto_de_RenoBo.121
    - Proyecto_de_RenoBo.122
    - Proyecto_de_RenoBo.126
    - Proyecto_de_RenoBo.127
    - Proyecto_de_RenoBo.128
    - Proyecto_de_RenoBo.129
    - Proyecto_de_RenoBo.130
    - Proyecto_de_RenoBo.135
    - Proyecto_de_RenoBo.136
    - Proyecto_de_RenoBo.147
    - Proyecto_de_RenoBo.150
  # Live area = pilot areas buffered by this margin. Results are reported here.
  live_margin_m: 5000

# Dead buffer around the live area, used for routing only.
# Effective width = max(buffer_min_m, max(distances)).
buffer_min_m: 5000

# One stitched network for the urban area plus a margin (ADR-0007). MVI inside the
# Bogotá boundary, OSM outside it. Each analysis clips its network extent from it.
stitch:
  boundary_source: ideca_limite_bogota
  urban_source: sdp_perimetro_urbano
  # Stitch extent = urban perimeter buffered by this, united with the network extent.
  # Must be at least the dead-buffer width, so the full city keeps its whole buffer.
  stitch_margin_m: 10000
  # Each side is cleaned this far past the boundary before the cut, so the seam is
  # not at the edge of what neatnet sees.
  clean_overlap_m: 500

# Cleaning each side with neatnet before the join (ADR-0005, ADR-0007).
clean:
  # Arguments passed to neatnet.neatify; empty means neatnet's defaults.
  neatify: {}
  # A raw line counts as kept if a cleaned line lies within match_m of it. neatnet
  # merges the two carriageways of a divided road into one line between them, so this
  # must cover half the widest median: at 25 m, 81.7 km of avenues (AC/AK) did not match;
  # at 50 m, 8.9 km (first run, 2026-11-22).
  match_m: 50
  # Spacing of the points sampled along each raw line for that test.
  sample_step_m: 10
  # The join stops if a piece at least min_piece_m long keeps less than min_kept_ratio
  # of its length. Shorter pieces that vanish are listed in the review layer only.
  min_piece_m: 100
  min_kept_ratio: 0.5

# No scenarios in v1 (ADR-0003): one network, MVI inside Bogotá + OSM outside.
