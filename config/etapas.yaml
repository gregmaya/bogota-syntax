# Layers published for bogota-atlas (contract: bogota-pop ADR-0013, schema in
# bogota-atlas/schema/etapas.schema.json). `uv run bogota-syntax publish` builds one PMTiles
# per layer plus etapas.json in data/processed/etapas/. Breaks, bounds and field types are
# computed from the data; only text and choices live here.

schema_version: "1.0"
producer: bogota-syntax
out_dir: data/processed/etapas
# Twelve colour classes, starting at quantiles 0, 1/12, ... 11/12 of the live segments.
quantile_classes: 12

networks:
  v2:
    input: data/processed/centrality_city_v2.parquet
    # Only live segments (inside the urban perimeter) are published; the rest is the
    # dead buffer and its values are not meaningful.
    live_only: true
    minzoom: 11
    maxzoom: 16
    sources:
      - ideca_malla_vial
      - sdp_eje_vial
      - sdp_red_infraestructura_vial
      - uaecd_lote
      - ideca_limite_bogota
      - sdp_perimetro_urbano
    attribution: >-
      IDECA / UAECD, Mapa de Referencia, Malla Vial Integral (CC BY 4.0); SDP, Eje vial y
      Red de infraestructura vial arterial, POT Bogotá D.C. (CC BY 4.0); UAECD, Lote (CC BY 4.0)
    network_method:
      es: >-
        Red v2 (automática): ejes viales de la SDP limpiados con los polígonos del POT como
        primer plano, Malla Vial Integral conectada a ellos y limpiada con neatnet, con las
        manzanas privadas de catastro (LOTDISTRIT = 0) protegidas y el primer plano original
        restaurado; cruces sin nodo convertidos en intersecciones. Construida con scripts
        de prueba que aún no están en el paquete.
      en: >-
        Network v2 (automated): SDP street axes cleaned with the POT polygons as the
        foreground, Malla Vial Integral joined to them and cleaned with neatnet, with
        cadastral private blocks (LOTDISTRIT = 0) protected and the original foreground
        restored; crossings with no junction made into junctions. Built with spike scripts
        that are not in the package yet.

layers:
  - id: red_vial_v2
    network: v2
    style_field: source
    kind: categorical
    title: {es: "Red vial v2, por origen", en: "Street network v2, by origin"}
    description:
      es: Cada segmento de la red v2, coloreado según de dónde viene su geometría.
      en: Each segment of network v2, coloured by where its geometry comes from.
    review:
      es: ¿Hay líneas paralelas o huecos donde el primer plano se une al fondo?
      en: Are there parallel lines or gaps where the foreground meets the background?
    unit: {es: "origen de la geometría", en: "geometry origin"}

  - &harmonic
    id: centralidad_armonica_800_v2
    network: v2
    style_field: cc_harmonic_800_ang
    kind: sequential
    title: {es: "Cercanía armónica angular, 800 m (red v2)", en: "Angular harmonic closeness, 800 m (network v2)"}
    description:
      es: Cercanía de cada segmento a los demás dentro de 800 m, por la ruta más simple.
      en: How close each segment is to the others within 800 m, by the simplest route.
    review:
      es: ¿Los valores bajan cerca del límite de la ciudad? ¿Cambian mucho frente a v1?
      en: Do values drop near the city limit? Do they change much from v1?
    unit: {es: "índice, sin unidad", en: "index, no unit"}
  - <<: *harmonic
    id: centralidad_armonica_2000_v2
    style_field: cc_harmonic_2000_ang
    title: {es: "Cercanía armónica angular, 2000 m (red v2)", en: "Angular harmonic closeness, 2000 m (network v2)"}
    description:
      es: Cercanía de cada segmento a los demás dentro de 2000 m, por la ruta más simple.
      en: How close each segment is to the others within 2000 m, by the simplest route.
  - <<: *harmonic
    id: centralidad_armonica_5000_v2
    style_field: cc_harmonic_5000_ang
    title: {es: "Cercanía armónica angular, 5000 m (red v2)", en: "Angular harmonic closeness, 5000 m (network v2)"}
    description:
      es: Cercanía de cada segmento a los demás dentro de 5000 m, por la ruta más simple.
      en: How close each segment is to the others within 5000 m, by the simplest route.

  - &betweenness
    id: intermediacion_800_v2
    network: v2
    style_field: cc_betweenness_800_ang
    kind: sequential
    title: {es: "Intermediación angular, 800 m (red v2)", en: "Angular betweenness, 800 m (network v2)"}
    description:
      es: Cuántas rutas más simples de hasta 800 m pasan por cada segmento.
      en: How many simplest routes of up to 800 m pass through each segment.
    review:
      es: ¿Las vías principales destacan? ¿Hay calzadas paralelas que se reparten el valor?
      en: Do main streets stand out? Do parallel carriageways split the value?
    unit: {es: "conteo de rutas", en: "count of routes"}
  - <<: *betweenness
    id: intermediacion_2000_v2
    style_field: cc_betweenness_2000_ang
    title: {es: "Intermediación angular, 2000 m (red v2)", en: "Angular betweenness, 2000 m (network v2)"}
    description:
      es: Cuántas rutas más simples de hasta 2000 m pasan por cada segmento.
      en: How many simplest routes of up to 2000 m pass through each segment.
  - <<: *betweenness
    id: intermediacion_5000_v2
    style_field: cc_betweenness_5000_ang
    title: {es: "Intermediación angular, 5000 m (red v2)", en: "Angular betweenness, 5000 m (network v2)"}
    description:
      es: Cuántas rutas más simples de hasta 5000 m pasan por cada segmento.
      en: How many simplest routes of up to 5000 m pass through each segment.
